version: '3.8'

services:
  network-scanner-web:
    build: .
    image: network-scanner-web:latest
    container_name: network-scanner-web
    network_mode: host
    volumes:
      - ./scans:/output
    # ports:
    #   - "5000:5000"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped