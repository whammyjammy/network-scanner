<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Scanner</title>
    <link rel="stylesheet" href="../static/css/styles.css">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔒 Network Scanner</h1>
            <p>Comprehensive security assessment powered by RustScan & Nikto</p>
        </div>
        
        <div class="scan-form">
            <h2>Start New Scan</h2>
            <form id="scanForm">
                <div class="form-group">
                    <label for="target">Target IP Address or Hostname</label>
                    <input type="text" id="target" name="target" placeholder="e.g., 192.168.1.1 or example.com" required>
                </div>
                <button type="submit" class="btn" id="startBtn">Start Vulnerability Scan</button>
            </form>
        </div>
        
        <div class="scan-results" id="results">
            <h2>Scan Results</h2>
            <div id="scanInfo"></div>
            
            <button class="btn btn-cancel" id="cancelBtn" style="display: none;" onclick="cancelScan()">
                ⏹️ Cancel Scan
            </button>
            
            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressBar">0%</div>
                </div>
            </div>
            
            <div class="results-grid">
                <div class="result-card">
                    <h3>📡 Open Ports</h3>
                    <ul class="port-list" id="portList">
                        <li>Scanning...</li>
                    </ul>
                </div>
                
                <div class="result-card">
                    <h3>⚠️ Vulnerabilities</h3>
                    <ul class="vuln-list" id="vulnList">
                        <li>Scanning...</li>
                    </ul>
                </div>
            </div>
            
            <div class="result-card">
                <h3>📋 Scan Logs</h3>
                <div class="log-console" id="logConsole"></div>
            </div>
            
            <div class="download-buttons" id="downloadButtons" style="display: none;">
                <button class="btn btn-download" onclick="downloadReport()">📄 Download Report</button>
                <button class="btn btn-download" onclick="downloadJSON()">💾 Download JSON</button>
            </div>
        </div>
    </div>
    
    <script src="../static/js/scanner.js"></script>
</body>
</html>
