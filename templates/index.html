<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Vulnerability Scanner</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style src="./styles.css"></style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔒 Network Vulnerability Scanner</h1>
            <p>Comprehensive security assessment powered by RustScan & Nikto</p>
        </div>
        
        <div class="scan-form">
            <h2>Start New Scan</h2>
            <form id="scanForm">
                <div class="form-group">
                    <label for="target">Target IP Address or Hostname</label>
                    <input type="text" id="target" name="target" placeholder="e.g., 192.168.1.1 or example.com" required>
                </div>
                <button type="submit" class="btn" id="startBtn">Start Vulnerability Scan</button>
            </form>
        </div>
        
        <div class="scan-results" id="results">
            <h2>Scan Results</h2>
            <div id="scanInfo"></div>
            
            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressBar">0%</div>
                </div>
            </div>
            
            <div class="results-grid">
                <div class="result-card">
                    <h3>📡 Open Ports</h3>
                    <ul class="port-list" id="portList">
                        <li>Scanning...</li>
                    </ul>
                </div>
                
                <div class="result-card">
                    <h3>⚠️ Vulnerabilities</h3>
                    <ul class="vuln-list" id="vulnList">
                        <li>Scanning...</li>
                    </ul>
                </div>
            </div>
            
            <div class="result-card">
                <h3>📋 Scan Logs</h3>
                <div class="log-console" id="logConsole"></div>
            </div>
            
            <div class="download-buttons" id="downloadButtons" style="display: none;">
                <button class="btn btn-download" onclick="downloadReport()">📄 Download Report</button>
                <button class="btn btn-download" onclick="downloadJSON()">💾 Download JSON</button>
            </div>
        </div>
    </div>
    
    <script>
        const socket = io();
        let currentScanId = null;
        
        socket.on('connect', () => {
            console.log('Connected to scanner');
        });
        
        socket.on('scan_progress', (data) => {
            if (data.scan_id === currentScanId) {
                updateProgress(data.progress, data.status);
            }
        });
        
        socket.on('scan_log', (data) => {
            if (data.scan_id === currentScanId) {
                addLog(data.log);
            }
        });
        
        socket.on('port_found', (data) => {
            if (data.scan_id === currentScanId) {
                addPort(data.port);
            }
        });
        
        socket.on('vulnerability_found', (data) => {
            if (data.scan_id === currentScanId) {
                addVulnerability(data.vulnerability);
            }
        });
        
        document.getElementById('scanForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const target = document.getElementById('target').value;
            const startBtn = document.getElementById('startBtn');
            
            startBtn.disabled = true;
            startBtn.textContent = 'Starting Scan...';
            
            try {
                const response = await fetch('/api/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ target })
                });
                
                const data = await response.json();
                currentScanId = data.scan_id;
                
                document.getElementById('results').classList.add('active');
                document.getElementById('scanInfo').innerHTML = `
                    <h3>Target: ${data.target}</h3>
                    <span class="status-badge status-${data.status}">Status: ${data.status}</span>
                    <p>Scan ID: ${data.scan_id}</p>
                `;
                
                document.getElementById('portList').innerHTML = '';
                document.getElementById('vulnList').innerHTML = '';
                document.getElementById('logConsole').innerHTML = '';
                
                socket.emit('subscribe', { scan_id: currentScanId });
                
            } catch (error) {
                alert('Failed to start scan: ' + error.message);
            } finally {
                startBtn.disabled = false;
                startBtn.textContent = 'Start Vulnerability Scan';
            }
        });
        
        function updateProgress(progress, status) {
            const progressBar = document.getElementById('progressBar');
            progressBar.style.width = progress + '%';
            progressBar.textContent = progress + '%';
            
            const statusBadge = document.querySelector('.status-badge');
            if (statusBadge) {
                statusBadge.className = `status-badge status-${status}`;
                statusBadge.textContent = 'Status: ' + status.replace('_', ' ');
            }
            
            if (progress === 100) {
                document.getElementById('downloadButtons').style.display = 'flex';
            }
        }
        
        function addLog(log) {
            const logConsole = document.getElementById('logConsole');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${log.level}`;
            entry.textContent = `[${log.timestamp}] ${log.message}`;
            logConsole.appendChild(entry);
            logConsole.scrollTop = logConsole.scrollHeight;
        }
        
        function addPort(port) {
            const portList = document.getElementById('portList');
            if (portList.children.length === 1 && portList.children[0].textContent === 'Scanning...') {
                portList.innerHTML = '';
            }
            
            const li = document.createElement('li');
            li.className = 'port-item';
            li.textContent = `Port ${port}/tcp`;
            portList.appendChild(li);
        }
        
        function addVulnerability(vuln) {
            const vulnList = document.getElementById('vulnList');
            if (vulnList.children.length === 1 && vulnList.children[0].textContent === 'Scanning...') {
                vulnList.innerHTML = '';
            }
            
            const li = document.createElement('li');
            li.className = 'vuln-item';
            li.textContent = `Port ${vuln.port}: ${vuln.finding}`;
            vulnList.appendChild(li);
        }
        
        function downloadReport() {
            window.location.href = `/api/scan/${currentScanId}/report`;
        }
        
        function downloadJSON() {
            window.location.href = `/api/scan/${currentScanId}/json`;
        }
    </script>
</body>
</html>
